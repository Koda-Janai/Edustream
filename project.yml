name: Edustream
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  Edustream:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [GoogleService-Info.plist]
      - path: App/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.udg.edustream
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
  EdustreamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOSTests]
    dependencies:
      - target: Edustream
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Edustream:
    build:
      targets:
        Edustream: all
    test:
      config: Debug
      environmentVariables:
        EDUSTREAM_EMULADOR: "1"
      targets:
        - EdustreamTests
